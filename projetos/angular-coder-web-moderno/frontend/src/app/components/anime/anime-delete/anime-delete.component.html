<mat-card>
    <mat-card-title>Deletando Anime</mat-card-title>

    <form action="">
        <mat-form-field>
            <input matInput placeholder="Nome" 
                [value]="anime.nome"
                name="nome" disabled>
        </mat-form-field>

        <mat-form-field>
            <input matInput placeholder="Nota" 
                [value]="anime.nota"
                name="nota" disabled>
        </mat-form-field>
    </form>

    <button mat-raised-button (click)="deleteAnime()" class="delete">
        Deletar
    </button>
    <button mat-raised-button (click)="cancel()" class="cancelar">
        Cancelar
    </button>

</mat-card>
