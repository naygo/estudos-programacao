<!DOCTYPE html>
<html lang="pt-br"> 
    <head>
        <meta charset="UTF-8">
        <title>Contato - Barbearia Alura</title>
        <link rel="stylesheet" href="../HTML5 e CSS3 parte 2/reset.css">
        <link rel="stylesheet" href="../HTML5 e CSS3 parte 2/style.css">
    </head>
    <body>

        <header>
            <div class="caixa">
                <h1><img src="../HTML5 e CSS3 parte 2/logo.png" alt="Logo da Barbearia Alura"></h1>
                <nav>
                    <ul>
                        <li><a href="../HTML5 e CSS3 parte 1 e parte 4/index.html">Home</a></li>
                        <li><a href="../HTML5 e CSS3 parte 2/produtos.html">Produtos</a></li>
                        <li><a href="contato.html">Contato</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main>
           <form>
               <label for="nome">Nome e sobrenome</label>
               <input type="name" id="nome" class="input-padrao" required>  

               <label for="email">Email</label>
               <input type="text" id="email" class="input-padrao" required placeholder="seuemail@dominio.com"> 

               <label for="telefone">Telefone</label>
               <input type="text" id="telefone" class="input-padrao" required placeholder="(xx)xxxxx-xxxx"> 

               <label for="mensagem">Mensagem</label>
               <textarea cols="70" rows="10" id="mensagem" class="input-padrao" required></textarea>

                <fieldset>
                   <legend>Como você prefere nosso contato?</legend>
                   <label for="radio-email">
                       <input type="radio" name="contato" value="email" id="radio-email">
                       Email
                    </label>
                   
                   <label for="radio-telefone">
                       <input type="radio" name="contato" value="telefone" id="radio-telefone">
                       Telefone
                    </label>
                   
                   <label for="radio-whatsapp">
                       <input type="radio" name="contato" value="whatsapp" id="radio-whatsapp" checked>
                       Whatsapp
                    </label>
                </fieldset>
                
                <fieldset>
                    <legend>Qual horário prefere ser atendido?</legend>
                    <select>
                        <option>Manhã</option>
                        <option>Tarde</option>
                        <option>Noite</option>
                     </select>

                </fieldset>
                   
                    <label><input type="checkbox" class="checkbox"> Gostaria de receber nossas novidades por email?</input></label>

                   <input type="submit" value="Enviar formulário" class="enviar">
               </div>              
               
           </form>

           <table>
               <thead>
                   <tr>
                       <th>Dias</th>
                       <th>Horário</th>
                    </tr>
                </thead>
               
                <tbody>
                    <tr>
                        <td>Segunda</td>
                        <td>8h - 20h</td>
                    </tr>
     
                    <tr>
                        <td>Quarta</td>
                        <td>8h - 20h</td>
                    </tr>
     
                    <tr>
                        <td>Sexta</td>
                        <td>8h - 20h</td>
                    </tr>
                </tbody>
                
           </table>

        </main>

        <footer>
            <img src="../HTML5 e CSS3 parte 2/logo-branco.png" alt="Logo da Barbearia Alura">
            <p class="copyright">&copy; Copyright Barbearia Alura - 2019</p>
        </footer>
    </body>
</html>
